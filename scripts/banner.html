<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner do README</title>
<!-- Fonte do banner do README: renderizado em docs/banner.png por scripts/record_demo.py -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&display=swap">
<style>
  body { margin: 0; background: transparent; }
  .banner {
    width: 1280px; height: 420px; box-sizing: border-box; padding: 56px 64px; border-radius: 28px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 470px; align-items: center; position: relative;
    background:
      radial-gradient(circle at 78% 18%, rgb(255 255 255 / .9), transparent 30%),
      radial-gradient(circle at 10% 110%, rgb(255 200 61 / .35), transparent 35%),
      linear-gradient(135deg, #e3eeff, #cfe2ff 55%, #b5d2ff);
    font-family: Nunito, system-ui, sans-serif; color: #14213d;
  }
  .banner::after { content: ''; position: absolute; right: -60px; bottom: -90px; width: 560px; height: 260px; border-radius: 50%; background: rgb(255 255 255 / .55); }
  .marca { display: flex; align-items: center; gap: 16px; }
  .marca img { width: 78px; transform: rotate(-6deg); filter: drop-shadow(0 8px 16px rgb(30 107 255 / .35)); }
  h1 { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 76px; margin: 0; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #1e6bff; position: relative; }
  h1 em::after { content: ''; position: absolute; left: 2px; right: 2px; bottom: 6px; height: 12px; border-radius: 99px; background: #ffc83d; z-index: -1; }
  h1 { position: relative; z-index: 0; }
  p { font-size: 25px; font-weight: 800; line-height: 1.3; margin: 18px 0 22px; max-width: 640px; color: #23365f; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chips span { background: #fff; border-radius: 99px; padding: 8px 16px; font-weight: 800; font-size: 17px; color: #1553cc; box-shadow: 0 4px 12px rgb(30 90 220 / .12); }
  .cena { width: 470px; position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <div style="position: relative; z-index: 1">
      <div class="marca"><img src="../img/logo.svg" alt=""><h1>Estuda<em>AI</em></h1></div>
      <p>Grave a aula, fotografe o quadro e estude com IA: resumos, slides, flashcards e respostas com fontes.</p>
      <div class="chips"><span>🤖 Agente com tool use</span><span>🔎 RAG avaliado</span><span>📊 Ciência de dados</span><span>🎧 Whisper no navegador</span></div>
    </div>
    <img class="cena" src="../img/cena-3d.svg" alt="">
  </div>
</body>
</html>
