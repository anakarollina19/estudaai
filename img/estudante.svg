<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Estudante de cabelo cacheado e fones de ouvido acenando, com mochila e caderno">
  <defs>
    <linearGradient id="moletom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a596e8"/>
      <stop offset="1" stop-color="#8a78e0"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="120" cy="252" rx="70" ry="7" fill="#5d4bb0" opacity=".14"/>

  <!-- mochila (atrás do corpo) -->
  <rect x="58" y="168" width="124" height="84" rx="30" fill="#ffd166"/>

  <!-- cabelo cacheado (parte de trás) -->
  <g fill="#2b1d16">
    <circle cx="86" cy="96" r="22"/><circle cx="154" cy="96" r="22"/>
    <circle cx="92" cy="68" r="24"/><circle cx="148" cy="68" r="24"/>
    <circle cx="120" cy="54" r="26"/><circle cx="80" cy="122" r="17"/><circle cx="160" cy="122" r="17"/>
    <circle cx="84" cy="142" r="12"/><circle cx="156" cy="142" r="12"/>
  </g>

  <!-- capuz, pescoço e corpo (moletom) -->
  <path d="M78 168c0-22 18-30 42-30s42 8 42 30z" fill="#7a66d6"/>
  <rect x="110" y="130" width="20" height="26" rx="6" fill="#b87a52"/>
  <path d="M68 256c0-56 20-100 52-100s52 44 52 100z" fill="url(#moletom)"/>
  <path d="M96 158q24 18 48 0" fill="none" stroke="#7a66d6" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 170v22M130 170v22" stroke="#ede8ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="194" r="3" fill="#ede8ff"/><circle cx="130" cy="194" r="3" fill="#ede8ff"/>
  <!-- alças da mochila -->
  <path d="M84 176c-4 24-4 50 0 76M156 176c4 24 4 50 0 76" stroke="#f6a94a" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- fones no pescoço -->
  <path d="M90 146q30 26 60 0" fill="none" stroke="#f7a8c8" stroke-width="7" stroke-linecap="round"/>
  <rect x="80" y="134" width="16" height="22" rx="7" fill="#ee86b2"/>
  <rect x="144" y="134" width="16" height="22" rx="7" fill="#ee86b2"/>

  <!-- cabeça -->
  <ellipse cx="120" cy="100" rx="34" ry="38" fill="#c98a5f"/>
  <!-- orelhas com brinco -->
  <ellipse cx="86" cy="104" rx="6" ry="9" fill="#b87a52"/>
  <ellipse cx="154" cy="104" rx="6" ry="9" fill="#b87a52"/>
  <circle cx="154" cy="116" r="3" fill="#ffd166"/>
  <!-- franja cacheada -->
  <g fill="#2b1d16">
    <circle cx="100" cy="68" r="15"/><circle cx="120" cy="62" r="16"/><circle cx="140" cy="68" r="14"/>
    <circle cx="88" cy="80" r="10"/><circle cx="152" cy="80" r="10"/>
  </g>
  <!-- rosto -->
  <path d="M100 92q6-5 12 0M128 92q6-5 12 0" fill="none" stroke="#2b1d16" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="106" cy="104" rx="4.2" ry="5.4" fill="#2a2140"/>
  <ellipse cx="134" cy="104" rx="4.2" ry="5.4" fill="#2a2140"/>
  <circle cx="107.6" cy="102" r="1.6" fill="#fff"/><circle cx="135.6" cy="102" r="1.6" fill="#fff"/>
  <ellipse cx="96" cy="116" rx="7" ry="4" fill="#ee86b2" opacity=".55"/>
  <ellipse cx="144" cy="116" rx="7" ry="4" fill="#ee86b2" opacity=".55"/>
  <path d="M110 118q10 10 20 0" fill="#fff" stroke="#7a3b2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- braço acenando -->
  <path d="M160 186c14-14 22-40 26-66" fill="none" stroke="url(#moletom)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="188" cy="110" r="13" fill="#c98a5f"/>
  <path d="M182 100v-12M189 98v-14M196 101v-11" stroke="#c98a5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M206 86q8 6 6 16M212 76q12 10 10 26" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round"/>

  <!-- braço segurando o caderno -->
  <g transform="rotate(-10 92 214)">
    <rect x="62" y="188" width="56" height="60" rx="8" fill="#f7a8c8"/>
    <rect x="62" y="188" width="10" height="60" rx="4" fill="#ee86b2"/>
    <path d="M80 204h28M80 216h28M80 228h18" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
  </g>
  <circle cx="114" cy="226" r="11" fill="#c98a5f"/>

  <!-- brilhinhos -->
  <path d="M46 52l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffd166"/>
  <path d="M196 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f7a8c8"/>
</svg>
